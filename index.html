<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abandoned Lands Story Map</title>
<meta name="description" content="A living map of the External Evils and Lesser Evils across the Swordcraft Abandoned Lands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: a war table. The map fills the left, a ledger panel sits right, the story timeline runs under the map. */
:root {
  --bg: #dcdfd8; --panel: #f2f3ee; --panel-2: #e7e9e2; --ink: #1d2321; --muted: #59625d; --line: #c2c7bf;
  --accent: #7b4e18; --accent-ink: #fff8ec; --focus: #1f5f8c;
  --land: #e9dfc2; --land-hi: #ddd8c8; --land-trop: #d9e0bb; --land-wild: #cdbf9c; --sea: #a8c0c2; --sea-deep: #93b1b5;
  --coast: #5b5140; --road: #8a6a3e; --river: #5f8fa0; --mount: #6f6656; --forest: #5d7348; --label: #2a241a; --label-halo: #f1e8cf;
  --pale: #5c7d27; --drowned: #136e8e; --gor: #ad261c; --wild: #95561a; --tok-ink: #ffffff; --lesser: #6a3d8f; --other: #4b545c; --mark: #0f6f86;
  --ok: #2f7a45; --uneasy: #7d8c2a; --warn: #b07a12; --peril: #c4561c; --bad: #b3261e; --fallen: #2b2622;
  --f-display: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-fell: "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --r: 6px; --art-filter: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121618; --panel: #1b2124; --panel-2: #232b2e; --ink: #e8e4d8; --muted: #9ba39e; --line: #313a3d;
  --accent: #d6a44e; --accent-ink: #1a1408; --focus: #7fc1ee;
  --land: #3b3426; --land-hi: #36342c; --land-trop: #303624; --land-wild: #2c271c; --sea: #18282d; --sea-deep: #122025;
  --coast: #b39d6e; --road: #a2824d; --river: #4f8ba1; --mount: #a39778; --forest: #7d9661; --label: #efe5c8; --label-halo: #2a251b;
  --pale: #9cc35a; --drowned: #4fb0d1; --gor: #e5584b; --wild: #d8954a; --tok-ink: #10140f; --lesser: #bf9ae2; --other: #b3bec7; --mark: #5fc4dc;
  --ok: #6cc489; --uneasy: #b9c75a; --warn: #e2b04a; --peril: #ef8a4a; --bad: #ef6a5e; --fallen: #0b0a09; --art-filter: brightness(.82) saturate(.9);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121618; --panel: #1b2124; --panel-2: #232b2e; --ink: #e8e4d8; --muted: #9ba39e; --line: #313a3d;
  --accent: #d6a44e; --accent-ink: #1a1408; --focus: #7fc1ee;
  --land: #3b3426; --land-hi: #36342c; --land-trop: #303624; --land-wild: #2c271c; --sea: #18282d; --sea-deep: #122025;
  --coast: #b39d6e; --road: #a2824d; --river: #4f8ba1; --mount: #a39778; --forest: #7d9661; --label: #efe5c8; --label-halo: #2a251b;
  --pale: #9cc35a; --drowned: #4fb0d1; --gor: #e5584b; --wild: #d8954a; --tok-ink: #10140f; --lesser: #bf9ae2; --other: #b3bec7; --mark: #5fc4dc;
  --ok: #6cc489; --uneasy: #b9c75a; --warn: #e2b04a; --peril: #ef8a4a; --bad: #ef6a5e; --fallen: #0b0a09; --art-filter: brightness(.82) saturate(.9);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "head head" "map time" "map side"; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; }
header.top { grid-area: head; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 3vw, 32px); line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.brand p b { color: var(--ink); font-weight: 500; }
.head-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; letter-spacing: .02em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

.mapwrap { grid-area: map; position: relative; min-height: 0; min-width: 0; border-radius: 10px; overflow: hidden; background: var(--sea-deep); border: 1px solid var(--line); }
#map { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#map.panning { cursor: grabbing; }
.map-ctrl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.map-ctrl button, .chipbtn { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 32px; height: 32px; padding: 0 8px; font-size: 16px; line-height: 1; }
.layers { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: calc(100% - 70px); }
.layers summary { cursor: pointer; font-weight: 500; list-style: none; }
.layers summary::-webkit-details-marker { display: none; }
.layers summary::after { content: " ▾"; color: var(--muted); }
.layers[open] summary::after { content: " ▴"; }
.layers label { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: grid; grid-template-columns: auto auto; gap: 3px 14px; }
.legend .row { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.banner { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; background: var(--accent); color: var(--accent-ink); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
.tooltip { position: absolute; pointer-events: none; z-index: 5; width: max-content; max-width: 280px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; box-shadow: 0 6px 24px rgb(0 0 0 / .22); font-size: 13px; line-height: 1.35; }
.tooltip h4 { margin: 0 0 2px; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.tooltip .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.tooltip .pres { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }

/* Timeline */
.timeline { grid-area: time; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); max-height: 40vh; overflow-y: auto; gap: 6px 14px; align-items: center; }
.tl-btns { display: flex; gap: 6px; }
.tl-btns button { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); width: 36px; height: 34px; font-size: 15px; }
.tl-btns button.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tl-track { position: relative; min-width: 0; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.ticks { position: relative; height: 18px; margin: 2px 9px 0; }
.ticks button { position: absolute; transform: translateX(-50%); top: 0; border: 0; background: none; padding: 0 2px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks button.on { color: var(--ink); font-weight: 700; }
.tl-now { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-width: 0; }
.tl-now h2 { margin: 0; font-family: var(--f-fell); font-weight: 400; font-size: 19px; }
.tl-now .meta { color: var(--muted); font-size: 13px; }
.tl-now p { margin: 0; flex-basis: 100%; font-size: 14px; color: var(--ink); max-width: 90ch; }

/* Side ledger */
aside.side { grid-area: side; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; white-space: nowrap; background: transparent; padding: 10px 6px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.pane { overflow-y: auto; padding: 14px; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.pane h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.pane h5 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.evil { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; }
.evil.off { opacity: .55; }
.evil-head { display: flex; align-items: center; gap: 10px; }
.evil-head .nm { font-family: var(--f-fell); font-size: 19px; line-height: 1.1; }
.evil-head .tg { font-size: 12px; color: var(--muted); font-style: italic; }
.evil-head .grow { flex: 1; min-width: 0; }
.eye { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); font-size: 12px; padding: 3px 8px; }
.eye[aria-pressed="false"] { text-decoration: line-through; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 3px; transition: width .6s ease; }
.trend-up { color: var(--bad); font-weight: 700; } .trend-down { color: var(--ok); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
button.chip:hover { border-color: var(--accent); }
.evil dl, .region dl { margin: 0; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 3px 10px; font-size: 13px; }
.evil dt, .region dt { color: var(--muted); }
.evil dd, .region dd { margin: 0; }
.evil details summary { cursor: pointer; font-size: 13px; color: var(--accent); }

.pill { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; font-weight: 500; }
.st-holding { color: var(--ok); } .st-threatened { color: var(--warn); } .st-besieged { color: var(--bad); } .st-fallen { color: var(--muted); background: var(--fallen); } .st-liberated { color: var(--ok); }
.vis-public { color: var(--ok); } .vis-story { color: var(--warn); } .vis-nst { color: var(--bad); } .ex { color: var(--muted); }

.presrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.presrow:first-of-type { border-top: 0; }
.presrow .t { font-size: 13px; }
.presrow .t small { display: block; color: var(--muted); font-size: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stepper button { border: 0; background: var(--panel); width: 28px; height: 28px; }
.stepper span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hist button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 6px 8px; font-size: 13px; }
.hist button b { font-weight: 500; }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--muted); font-size: 14px; }

/* Story log */
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; }
.ev.cur { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ev .n { font-family: var(--f-display); font-size: 18px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.ev .tt { font-weight: 500; font-size: 14px; line-height: 1.25; }
.ev .mm { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.ev .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: end; }
.ev .acts button, .btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); font-size: 12px; padding: 3px 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; padding: 6px 12px; font-size: 14px; }
.btn.big { padding: 6px 12px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn:disabled, .ev .acts button:disabled { opacity: .4; cursor: default; }
.draft { border: 1px solid var(--accent); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field input, .field select, .field textarea, .chg select, .chg input { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 7px; font-size: 14px; min-width: 0; width: 100%; }
.field textarea { resize: vertical; min-height: 56px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chg { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel); position: relative; }
.chg .full { grid-column: 1 / -1; }
.chg .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; color: var(--muted); font-size: 16px; }
.chg label.ck { display: flex; gap: 6px; align-items: center; font-size: 13px; grid-column: 1 / -1; }
.warns { display: flex; flex-direction: column; gap: 4px; }
.warns div { font-size: 12.5px; border-left: 3px solid var(--warn); padding: 2px 8px; background: color-mix(in srgb, var(--warn) 10%, transparent); }
.warns div.hard { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.setup { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.setup summary { cursor: pointer; font-weight: 500; }
.note { font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; }

/* SVG map styling */
.terr { stroke: #3d2f1a; stroke-opacity: .55; stroke-width: 2; stroke-dasharray: 7 6; transition: fill-opacity .5s; }
.terr.sea { stroke: var(--river); stroke-opacity: .35; }
.terr.hover { stroke-opacity: 1; stroke-dasharray: none; stroke-width: 3; fill: var(--accent); fill-opacity: .12; }
.noborder .terr:not(.hover):not(.sel) { stroke-opacity: 0; }
#base-art { filter: var(--art-filter); }
.terr.sel { stroke: var(--accent); stroke-opacity: 1; stroke-dasharray: none; stroke-width: 3; }
.coast { fill: none; stroke: #3d2f1a; stroke-opacity: .5; stroke-width: 2; stroke-linejoin: round; }
.coast-glow { fill: none; stroke: var(--sea); stroke-width: 16; stroke-opacity: .55; stroke-linejoin: round; }
.road { fill: none; stroke: #6b4a1f; stroke-opacity: .75; stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
.lane { fill: none; stroke: #2e6f86; stroke-opacity: .7; stroke-width: 2.5; stroke-dasharray: 1 8; stroke-linecap: round; }
.river { fill: none; stroke: var(--river); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mtn { fill: none; stroke: var(--mount); stroke-width: 1.5; stroke-linejoin: round; }
.tree { fill: var(--forest); fill-opacity: .55; }
.city-dot { fill: var(--label); stroke: var(--label-halo); stroke-width: 2; }
.city-ring { fill: none; stroke: #2a1d0c; stroke-width: 3; stroke-opacity: .8; }
.mlabel { font-family: var(--f-display); fill: var(--label); paint-order: stroke; stroke: var(--label-halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.mlabel.realm { font-family: var(--f-fell); font-style: italic; }
.mlabel.sea { font-family: var(--f-fell); font-style: italic; fill: var(--river); stroke: var(--sea); letter-spacing: .14em; }
.mlabel.feat { font-family: var(--f-fell); font-style: italic; font-size: 15px; fill: var(--muted); stroke-width: 3px; }
.tok { cursor: pointer; }
.tok .num { font-family: var(--f-body); font-weight: 700; font-size: 25px; fill: var(--tok-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tok .shape { stroke: var(--label-halo); stroke-width: 2; }
.tok.new .shape { animation: pop .7s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { transform: scale(.2); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
.tok.rise .halo { animation: rise 1.4s ease-out 2; transform-box: fill-box; transform-origin: center; }
@keyframes rise { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.4); } }
.halo { fill: none; stroke-width: 2.5; opacity: 0; }
.clash .ring { fill: none; stroke: var(--bad); stroke-width: 2.5; animation: clash 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes clash { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2); } }
.swords line { stroke: var(--label); stroke-width: 3.4; stroke-linecap: round; }
.swords circle { fill: var(--label-halo); stroke: var(--label); stroke-width: 1.4; }
.arrow { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 10 8; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -18; } }
.trail { fill: none; stroke-width: 3; stroke-opacity: .55; stroke-dasharray: 3 6; }
.status-ring { fill: none; stroke-width: 4.5; }
.citygrp.dragging { cursor: grabbing; }
.layout-mode .citygrp { cursor: grab; }
.dim { opacity: .25; transition: opacity .3s; }

@media (prefers-reduced-motion: reduce) {
  .arrow, .clash .ring, .tok.new .shape, .tok.rise .halo { animation: none; }
  .meter .bar i, .terr { transition: none; }
}

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto; grid-template-areas: "head" "map" "time" "side"; height: auto; }
  .mapwrap { aspect-ratio: 1000 / 1492; height: auto; max-height: 88vh; }
  #map { touch-action: pan-y; }
  aside.side { max-height: none; }
  .pane { overflow: visible; }
  .legend { display: none; }
}

[hidden] { display: none !important; }
/* Site additions: region view, lesser threats, sign-in, embed */
.head-tools { position: relative; }
.head-tools .btn.big { white-space: nowrap; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.pop textarea { width: 100%; min-height: 84px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; resize: vertical; }
.pop input { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; width: 100%; }
.who { font-size: 13px; color: var(--muted); }
.who b { color: var(--ink); font-weight: 500; }
.fullmap { display: none; }
body.embed .brand p { display: none; }
body.embed .brand h1 { font-size: 20px; }
body.embed .app { padding-block: 8px; gap: 8px; }
body.embed .fullmap { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }

.rview { position: absolute; inset: 0; z-index: 3; background: var(--sea-deep); display: flex; flex-direction: column; }
.rview[hidden] { display: none; }
.rview.enter { animation: rvin .45s ease-out; }
@keyframes rvin { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: none; } }
.rv-bar { display: flex; align-items: center; gap: 8px 12px; padding: 8px 10px; background: color-mix(in srgb, var(--panel) 95%, transparent); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rv-bar h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.rv-title { flex: 1; min-width: 140px; }
.rv-bar label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.rv-stage { position: relative; flex: 1; min-height: 0; }
#rmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#rmap.panning { cursor: grabbing; }
.site-edit #rmap { cursor: crosshair; }
.site-edit #rmap .site { cursor: move; }
.rv-art { filter: var(--art-filter); }
.rv-cell { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 8 6; }
.rv-tray { position: absolute; left: 10px; bottom: 10px; max-width: min(330px, calc(100% - 70px)); background: color-mix(in srgb, var(--panel) 93%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.rv-tray .row { display: flex; gap: 6px; align-items: center; }
.rv-hint { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; background: var(--accent); color: var(--accent-ink); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
.site-dot { fill: var(--label-halo); stroke: var(--label); }
.site.busy .site-dot { fill: var(--label); stroke: var(--label-halo); }
.site.sel .site-dot { stroke: var(--accent); fill: var(--accent); }
.site.pending .site-dot { fill: none; stroke: var(--accent); stroke-dasharray: 3 2; }
.slabel { font-family: var(--f-fell); fill: var(--label); paint-order: stroke; stroke: var(--label-halo); stroke-linejoin: round; pointer-events: none; }
.site.sel .slabel { font-weight: 700; }
.thr { cursor: pointer; }
.thr .shape { stroke: var(--label-halo); stroke-width: 2; }
.thr .num { font-family: var(--f-body); font-weight: 700; fill: var(--tok-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.thr.new .shape { animation: pop .7s ease-out; transform-box: fill-box; transform-origin: center; }
.thrlist { display: flex; flex-direction: column; }
.thrrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.thrrow:first-child { border-top: 0; }
.thrrow .t { font-size: 13px; }
.thrrow .t small { display: block; color: var(--muted); font-size: 12px; }
.thrrow .acts { display: flex; gap: 4px; }
.notebox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.notebox p { margin: 0; white-space: pre-wrap; }
.notebox textarea { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-height: 70px; resize: vertical; width: 100%; }
.sitebox { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
.sitebox input { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 7px; width: 100%; }
.modebar { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); background: var(--panel-2); }
@media (max-width: 900px) {
  .mapwrap.rv-open { aspect-ratio: auto; max-height: none; }
  .mapwrap.rv-open > #map, .mapwrap.rv-open > .layers, .mapwrap.rv-open > .map-ctrl, .mapwrap.rv-open > .banner { display: none; }
  .mapwrap.rv-open .rview { position: relative; inset: auto; }
  .rv-stage { flex: none; aspect-ratio: var(--rv-ar, 4 / 3); }
  .rv-tray { position: static; max-width: none; border-radius: 0; border-width: 1px 0 0; }
}
@media (prefers-reduced-motion: reduce) { .rview.enter, .thr.new .shape { animation: none; } }
.legend { left: auto; right: 10px; grid-template-columns: auto; max-width: 200px; }
.legend .row.muted { white-space: normal; }
/* Pinpoints, region conditions, the map notice and full screen */
.mk { cursor: pointer; }
.mk .shape { fill: var(--mark); stroke: var(--label-halo); stroke-width: 1.5; }
.mk .glyph { fill: var(--tok-ink); font-family: var(--f-body); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.new .shape { animation: pop .7s ease-out; transform-box: fill-box; transform-origin: bottom; }
.blackout { fill: #0d0c0b; fill-opacity: .8; }
.blackout.rv { fill-opacity: .66; }
.rv-stamp { font-family: var(--f-display); letter-spacing: .12em; text-transform: uppercase; paint-order: stroke; stroke-linejoin: round; }
.rv-stamp.fallen { fill: #efe6d6; stroke: #0d0c0b; opacity: .85; }
.rv-stamp.besieged { fill: var(--bad); stroke: var(--label-halo); opacity: .7; }
.since { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 4px; }
.rv-notice { padding: 6px 12px; font-size: 13px; background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border-bottom: 1px solid var(--line); border-left: 4px solid var(--warn); }
.mapwrap.fs { position: fixed; inset: 0; z-index: 60; width: 100vw; height: 100vh; height: 100dvh; max-height: none; aspect-ratio: auto; border-radius: 0; border: 0; }
.mapwrap.fs .rview { position: absolute; inset: 0; }
.mapwrap.fs .rv-stage { flex: 1; aspect-ratio: auto; }
body.fs-on { overflow: hidden; }
.map-ctrl button svg { display: block; margin: auto; }
.map-ctrl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Danger level */
.city-ring.dz { stroke-width: 6; stroke-opacity: 1; }
.pill.danger { background: var(--dc); color: var(--panel); border-color: transparent; }
.dgauge { display: flex; gap: 3px; margin: 6px 0 4px; }
.dgauge span { flex: 1; height: 10px; border-radius: 2px; }
.dname { font-size: 18px; font-weight: 600; }
.dkey { display: inline-flex; gap: 2px; vertical-align: middle; }
.dkey i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.nowbox { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.dset { margin-top: 10px; font-size: 14px; }
.dset summary { cursor: pointer; color: var(--accent); }
.dset input, .dset select { width: 100%; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 7px; }
/* Right now */
.overview { display: flex; flex-direction: column; gap: 6px; }
.ovrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.ovrow:hover { border-color: var(--accent); }
.ovname { font-weight: 600; margin-right: auto; }
.ovline { flex-basis: 100%; }

/* Dispatches, calendar, requests and the yearly recap */
.tabs button[hidden] { display: none; }
.tabbadge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; }
.calbadge rect { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.calbadge text { fill: var(--accent-ink); font-family: var(--f-body); font-size: 17px; font-weight: 700; }
.dlist, .callist { display: flex; flex-direction: column; gap: 10px; }
.dispatch, .request { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.dispatch.pinned { border-color: var(--accent); }
.dispatch h4 { margin: 0; font-family: var(--f-fell); font-weight: 400; font-size: 19px; line-height: 1.2; }
.dispatch p, .request p { margin: 0; }
.dfoot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.calrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.caldate { display: flex; flex-direction: column; align-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 3px 0; line-height: 1.1; }
.caldate b { font-size: 20px; }
.caldate span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.calrow .tt { font-weight: 500; }
.calrow .mm { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.calrow .acts { display: flex; gap: 4px; }
.calrow .acts button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 2px 7px; font-size: 12px; }
.calplan { margin-top: 4px; }
.ckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 2px 10px; }
.ck { display: flex; gap: 6px; align-items: center; font-size: 13.5px; }
.pill.rq-waiting { color: var(--warn); }
.pill.rq-approved { color: var(--ok); }
.pill.rq-changes { color: var(--uneasy); }
.pill.rq-declined { color: var(--bad); }
.request.st-waiting { border-left: 3px solid var(--warn); }
.rqreply { border-left: 3px solid var(--accent); padding: 2px 8px; font-size: 14px; }
.rqcomments { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.rqcomment, .rqdecide { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rqdecide { flex-direction: column; align-items: stretch; border-top: 1px solid var(--line); padding-top: 8px; }
.rqcomment input, .rqdecide input, .rqdecide select { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 7px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; }
.stat b { font-size: 24px; font-family: var(--f-display); font-weight: 400; line-height: 1; }
.stat span { font-size: 12px; color: var(--muted); }
.bych { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.bych div { display: grid; grid-template-columns: minmax(0, 1fr) auto 90px; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.bych div.quiet span:first-child { color: var(--bad); }
.aheadbox { display: flex; flex-direction: column; gap: 6px; }
.aheadbox button { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; }
.aheadbox button:hover { border-color: var(--accent); }
.calrow.past { opacity: .6; }
.calmonth { display: flex; flex-direction: column; gap: 6px; }
/* Turns and each region's own story */
.turnbox { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel-2); }
.turnbox b { font-family: var(--f-fell); font-weight: 400; font-size: 18px; }
.turnhead { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.turnhead button { border: 0; background: none; padding: 0; font-family: var(--f-fell); font-size: 17px; text-align: left; }
.turnhead.cur button { color: var(--accent); }
.turnlist { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.rstory .hist button.now { border-color: var(--accent); }
.rstory .hist button.later { opacity: .55; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>The Abandoned Lands Story Map</h1>
      <p id="subhead">Four External Evils and the Lesser Evils, tracked across the Chapter Network. <b id="sub-step"></b></p>
    </div>
    <div class="head-tools">
      <span class="lbl" id="layer-lbl">Viewing as</span>
      <div class="seg" role="group" aria-labelledby="layer-lbl" id="layerseg">
        <button type="button" data-layer="public">Players</button>
        <button type="button" data-layer="story">Story team</button>
        <button type="button" data-layer="nst">NST Team</button>
      </div>
      <button type="button" class="btn big" id="share-btn" aria-haspopup="dialog">Embed</button>
      <button type="button" class="btn big" id="who-btn" aria-haspopup="dialog" hidden>Rep sign in</button>
      <a class="btn big fullmap" id="fullmap" target="_blank" rel="noopener">Open full map ↗</a>
      <div class="pop" id="pop" role="dialog" hidden></div>
    </div>
  </header>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 1000 1492" role="img" aria-label="Map of the Abandoned Lands with threat positions"></svg>
    <details class="layers" id="layers">
      <summary>Map layers</summary>
      <label><input type="checkbox" id="ly-routes" checked> Trade roads and sea lanes</label>
      <label><input type="checkbox" id="ly-trails" checked> Past movements</label>
      <label><input type="checkbox" id="ly-threats" checked> Lesser evils and other threats</label>
      <label><input type="checkbox" id="ly-marks" checked> Pinpoints</label>
      <label><input type="checkbox" id="ly-danger" checked> Danger level on towns</label>
      <label><input type="checkbox" id="ly-cal" checked> Next event dates</label>
      <label><input type="checkbox" id="ly-names"> Extra name labels</label>
      <label><input type="checkbox" id="ly-tint" checked> Threat shading on regions</label>
      <label><input type="checkbox" id="ly-borders" checked> Region borders</label>
      <label><input type="checkbox" id="ly-art" checked> Shani's map art</label>
    </details>
    <div class="map-ctrl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit" aria-label="Fit whole map" title="Fit whole map">⤢</button>
      <button type="button" id="fs" aria-label="Full screen" title="Full screen" aria-pressed="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    </div>
    <div class="legend" id="legend" aria-label="Legend"></div>
    <div class="banner" id="banner" hidden></div>

    <div class="rview" id="rview" hidden>
      <div class="rv-bar">
        <button type="button" class="btn big" id="rv-back">← Whole map</button>
        <div class="rv-title"><div class="lbl" id="rv-band"></div><h2 id="rv-name"></h2></div>
        <span id="rv-status"></span>
        <label><input type="checkbox" id="rv-names"> All site names</label>
      </div>
      <div class="rv-notice" id="rv-notice" role="note" hidden></div>
      <div class="rv-stage" id="rv-stage">
        <svg id="rmap" role="img" aria-label="Region map with threat positions"></svg>
        <div class="map-ctrl">
          <button type="button" id="rz-in" aria-label="Zoom in">+</button>
          <button type="button" id="rz-out" aria-label="Zoom out">−</button>
          <button type="button" id="rz-fit" aria-label="Fit region" title="Fit region">⤢</button>
          <button type="button" id="rz-fs" aria-label="Full screen" title="Full screen" aria-pressed="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
        </div>
        <div class="rv-hint" id="rv-hint" hidden></div>
      </div>
      <div class="rv-tray" id="rv-tray"></div>
    </div>
    <div class="tooltip" id="tip" hidden></div>
  </div>

  <section class="timeline" aria-label="Story timeline">
    <div class="tl-btns">
      <button type="button" id="tl-first" aria-label="First event">⏮</button>
      <button type="button" id="tl-prev" aria-label="Previous event">◀</button>
      <button type="button" id="tl-play" class="play" aria-label="Play the story">▶</button>
      <button type="button" id="tl-next" aria-label="Next event">▶︎|</button>
    </div>
    <div class="tl-track">
      <label class="lbl" for="scrub" style="position:absolute;left:-9999px">Story year</label>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="tl-now" id="tl-now"></div>
  </section>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-threats" aria-selected="true" data-tab="threats">Threats</button>
      <button type="button" role="tab" id="tab-region" aria-selected="false" data-tab="region">Region</button>
      <button type="button" role="tab" id="tab-log" aria-selected="false" data-tab="log">Story log</button>
      <button type="button" role="tab" id="tab-overview" aria-selected="false" data-tab="overview">Right now</button>
      <button type="button" role="tab" id="tab-dispatches" aria-selected="false" data-tab="dispatches">Dispatches</button>
      <button type="button" role="tab" id="tab-calendar" aria-selected="false" data-tab="calendar">Calendar</button>
      <button type="button" role="tab" id="tab-requests" aria-selected="false" data-tab="requests" hidden>Requests</button>
      <button type="button" role="tab" id="tab-recap" aria-selected="false" data-tab="recap" hidden>Yearly recap</button>
    </div>
    <div class="pane" id="pane-threats" role="tabpanel" aria-labelledby="tab-threats"></div>
    <div class="pane" id="pane-region" role="tabpanel" aria-labelledby="tab-region" hidden></div>
    <div class="pane" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden></div>
    <div class="pane" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview" hidden></div>
    <div class="pane" id="pane-dispatches" role="tabpanel" aria-labelledby="tab-dispatches" hidden></div>
    <div class="pane" id="pane-calendar" role="tabpanel" aria-labelledby="tab-calendar" hidden></div>
    <div class="pane" id="pane-requests" role="tabpanel" aria-labelledby="tab-requests" hidden></div>
    <div class="pane" id="pane-recap" role="tabpanel" aria-labelledby="tab-recap" hidden></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
"use strict";
const CONFIG = Object.assign({ apiUrl: "", pollSeconds: 60 }, window.WARMAP_CONFIG || {});
const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.get("embed") === "1";
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1000, H = 1492;
const MAIN_SRC = "maps/main.jpg";

/* ---------- Lore (from the NST Guidebook and Community Update #3) ---------- */
const EVIL_ORDER = ["pale", "drowned", "gor", "wild"];
const EVILS = {
  pale: { name: "The Pale Host", short: "Pale Host", tagline: "Deathless empire", saying: "Death has patience. Death remembers.",
    figure: "Khallazar, the Lich-Regent (the Scarab King)", wants: "To complete something left undone. It collects the dead.",
    presses: "Braylong's north pass, and anywhere the living abandon their dead.", feel: "A slow, suffocating press. Silence, then drums.",
    counter: "Lay the dead to rest; break Bone Standards, soul-jars and Unholy Wards.", defectors: "Bound Remnants", shape: "diamond" },
  drowned: { name: "The Drowned Court", short: "Drowned Court", tagline: "Abyssal dominion", saying: "What the sea takes, it keeps.",
    figure: "The Abyssal Sovereign (the Coral Crown)", wants: "To drown the land and reclaim all water for the sea.",
    presses: "All oceans, coasts, rivers and wells; most strongly the Whispering Sea and the coast around Reefwatch Keep.", feel: "They seep rather than march. Salt on the grass, a well bubbling.",
    counter: "Destroy or sanctify coral spires; secure clean water; break the conch or Tide Totem.", defectors: "Brine-Oath Breakers", shape: "circle" },
  gor: { name: "The Gor Horde", short: "Gor Horde", tagline: "Warclan confederation", saying: "War is not what they do. War is what they are.",
    figure: "The Warchanter", wants: "Endless war, and to unmake the Age of Walls.",
    presses: "The western border of the Abandoned Lands.", feel: "Thunder that walks. Drums like heartbeats, then the chant: Prove. Or fall.",
    counter: "Silence the drums, take down war-banners, cut supply lines, answer a challenge.", defectors: "Black Feathers", shape: "square" },
  wild: { name: "The Wildwrought", short: "Wildwrought", tagline: "Living retribution", saying: "The world does not need you; it remembers how to live without you.",
    figure: "The Thorn-Regent (the Hart-Mask)", wants: "To rewild the world and purge abused magic.",
    presses: "Braylong's south swamp, and anywhere magic is mined, bottled or forced into machines.", feel: "Surgical, not frenzied. They strike, take what should not exist, and vanish.",
    counter: "Protect Fonts of Power, smash Briar Totems, make reparations.", defectors: "Penitents", shape: "triangle" },
};
const TIERS = [
  { n: 0, name: "None", fielded: "", reach: "", approval: "" },
  { n: 1, name: "Rumour", fielded: "Signs, omens, aftermath or a lone scout", reach: "One scene", approval: "Chapter story team" },
  { n: 2, name: "Pocket problem", fielded: "Swarm and bruiser units only", reach: "One event, one site", approval: "Chapter story team, logged with the NST Rep" },
  { n: 3, name: "Incursion", fielded: "Adds controllers and at most one champion", reach: "One region, a few events", approval: "NST Rep signs off" },
  { n: 4, name: "Campaign", fielded: "Champions recur; a named lieutenant may appear", reach: "A region or several chapters, across a season", approval: "NST Team (Brett or Andrew)" },
  { n: 5, name: "National event", fielded: "The figurehead appears", reach: "The whole Abandoned Lands; permanent change", approval: "NST Team only" },
];

  const keys = new Set((S.usingFallback ? [OPENING] : S.events).map(turnKey));
  const open = S.settings.turns?.open; if (open != null) keys.add(+open);
  return [...keys].sort((a, b) => a - b);
}

    for (const t in r.threats) th[t] = { ...r.threats[t] };

}

      g.setAttribute("transform", `translate(${x},${y})`);
      g.dataset.region = r.id;
      if (hiddenTok.has(key)) g.style.opacity = 0;
      if (S.focus && S.focus !== k) g.classList.add("dim");
      const before = prev[r.id]?.p[k] || 0;

function findThreatIn(st, tid) { return !!findThreat(st, tid); }
function swords(parent, r) {

  el("circle", { r: 14 }, sw);
  el("line", { x1: -8, y1: -8, x2: 8, y2: 8 }, sw); el("line", { x1: 8, y1: -8, x2: -8, y2: 8 }, sw);
  return sw;
}
function arcD(a, b, bend) { const mx = (a[0] + b[0]) / 2 - (b[1] - a[1]) * bend, my = (a[1] + b[1]) / 2 + (b[0] - a[0]) * bend; return `M${a[0]},${a[1]}Q${mx},${my} ${b[0]},${b[1]}`; }
function shorten(a, b, d) { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [b[0] - dx / l * d, b[1] - dy / l * d]; }
function fly(evil, from, to, tier, done) {
  const g = tokenEl(evil, tier, G.fx);
  const a = slotPos(from, evil), b = slotPos(to, evil);
  const mx = (a[0] + b[0]) / 2 - (b[1] - a[1]) * .18, my = (a[1] + b[1]) / 2 + (b[0] - a[0]) * .18;
  const t0 = performance.now(), D = 1100;
  const step = now => {
    let t = Math.min(1, (now - t0) / D); const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const x = (1 - e) * (1 - e) * a[0] + 2 * (1 - e) * e * mx + e * e * b[0];
    const y = (1 - e) * (1 - e) * a[1] + 2 * (1 - e) * e * my + e * e * b[1];
    g.setAttribute("transform", `translate(${x},${y}) scale(${1 + Math.sin(e * Math.PI) * .35})`);
    if (t < 1) requestAnimationFrame(step); else { g.remove(); done && done(); }
  };
  requestAnimationFrame(step);
}

}
function stepTurn(d) { if (TURNS.length) goTo(TURNS[Math.max(0, Math.min(TURNS.length - 1, turnIndexOf(S.idx) + d))].last, d > 0); }
function goTo(i, animate) {
  if (!EV.length) return;
  i = Math.max(0, Math.min(EV.length - 1, i));
  const ft = turnIndexOf(S.idx), tt = turnIndexOf(i), turn = TURNS[tt];
  S.idx = turn.last; i = S.idx;
  const forwardOne = animate && tt === ft + 1 && !reduced && !RV.id;
  const moves = forwardOne ? turn.events.flatMap(e => e.changes || []).filter(c => c.type === "move" && R[c.from] && R[c.to] && c.from !== c.to && !S.hidden.has(c.evil)) : [];
  const hide = new Set(moves.map(c => c.to + ":" + c.evil));
  redraw({ hiddenTok: hide, fresh: true });
  moves.forEach(c => {
    const tier = STATES[i][c.to].p[c.evil] || c.tier || 1;

}

/* ---------- Dispatches, the events calendar, chapter requests and the yearly recap ---------- */
S.dispatches = []; S.calendar = []; S.requests = [];
S.dispForm = null; S.calForm = null; S.reqForm = null; S.dispFilter = ""; S.recapYear = null;
const REQ_STATUS = { waiting: "Waiting for the NST Lead", approved: "Approved", changes: "Approved with changes", declined: "Declined" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

/* Story teams and reps write dispatches, calendar entries and requests for their own chapters; the NST Team for any. */
const canWriteFor = ch => isNST() || ((role() === "story" || role() === "rep") && (Store.me.chapters || []).includes(ch));
const writableChapters = () => CHAPTERS.filter(r => canWriteFor(r.id));
const storyLayer = () => VIS_RANK[S.layer] >= 1;
const showRequests = () => role() !== "viewer" && storyLayer();
const showRecap = () => isNST() && S.layer === "nst";
const chName = id => id === "national" ? "National" : (R[id]?.name || id);
const involvedIn = q => isNST() || [q.chapter, ...(q.affects || [])].some(c => (Store.me.chapters || []).includes(c));

/* Dates are kept as yyyy-mm-dd. */
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseDay = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const dayDiff = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const shortDate = s => { const d = parseDay(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const longDate = s => { const d = parseDay(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const isoDay = s => { const d = new Date(s); return isNaN(d) ? "" : `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const paras = t => String(t || "").split(/\n{2,}|\r\n\r\n/).filter(x => x.trim()).map(p => `<p>${esc(p.trim()).replace(/\n/g, "<br>")}</p>`).join("");
const threatLabel = k => EVILS[k]?.short || LESSER[k]?.name || "";
const safeLink = u => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";

function upcoming() { const t = todayStr(); return S.calendar.filter(c => c.date >= t).sort((a, b) => a.date.localeCompare(b.date) || chName(a.chapter).localeCompare(chName(b.chapter))); }
function nextEventFor(id) { return upcoming().find(c => c.chapter === id) || null; }
/* Two chapters planning the same evil within 30 days of each other. */
function calendarClashes() {
  const list = upcoming().filter(c => c.evil), out = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    if (a.evil === b.evil && a.chapter !== b.chapter && dayDiff(a.date, b.date) <= 30) out.push([a, b]);
  }
  return out;
}

/* Date badges on the main map: each chapter's next event. */

}

/* Small counts on the tab labels: events in the next 30 days, requests waiting. */

/* ---------- Draft editing ---------- */
function defaultChapter() { const mine = myChapters(); if (isNST()) return "national"; return mine[0] || "national"; }
function newDraft() { return { id: null, title: "", when: "", chapter: defaultChapter(), visibility: "story", summary: "", changes: [], turn: openTurnKey() }; }
function ensureDraft() { if (!S.draft) S.draft = newDraft(); return S.draft; }

  const now = site ? (cur.at[site]?.[evil] || 0) : (cur.base[evil] || 0);

  const ex = dr.changes.find(c => c.type === "set" && c.region === id && c.evil === evil && (c.site || "") === (site || ""));
  if (ex) ex.tier = t; else dr.changes.push(site ? { type: "set", evil, region: id, site, tier: t } : { type: "set", evil, region: id, tier: t });

}

const newTid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

function draftWarnings(dr) {
  const out = [], base = draftBaseState();
  let running = cloneState(base);
  for (const c of dr.changes) {
    if (c.type === "set" || c.type === "move") {
      const rid = c.type === "set" ? c.region : c.to;
      const before = running[rid]?.p[c.evil] || 0;
      const nextS = applyEvent(running, { changes: [c] });
      const after = nextS[rid]?.p[c.evil] || 0;
      const nm = `${EVILS[c.evil]?.short} in ${R[rid]?.name}`;
      if (after - before > 1) out.push({ t: `${nm} jumps from tier ${before} to ${after}. The guidebook climbs one tier at a time and gives players an event to respond.` });
      if (after > before && after === 5) out.push({ hard: true, nst: true, t: `${nm} reaches tier 5: a national event where the figurehead appears. NST Team only.` });
      else if (after > before && after === 4) out.push({ hard: true, nst: true, t: `${nm} at tier 4 is a campaign. Brett or Andrew must approve it.` });
      else if (after > before && after === 3 && R[rid]?.kind === "chapter") out.push({ t: `${nm} at tier 3 is an incursion. The chapter's NST Rep signs off, and it is limited to one per evil per chapter per season.` });
      if (c.type === "move" && !(c.fromSite ? running[c.from]?.at[c.fromSite]?.[c.evil] : running[c.from]?.p[c.evil])) out.push({ t: `${EVILS[c.evil]?.short} has no force in ${R[c.from]?.name}${c.fromSite ? " at " + siteName(c.from, c.fromSite) : ""} to move from at this point.` });
    }
    if (c.type === "clash" && c.a === c.b) out.push({ t: "A clash needs two different evils." });
    if (c.type === "threat" && !c.remove) {
      const wasR = findThreat(running, c.tid), old = wasR ? running[wasR].threats[c.tid] : null, nm = c.name || threatName(c);
      if (c.kind === "lesser" && +c.tier > 3) out.push({ hard: true, nst: true, t: `Lesser Evils stop at tier 3. Past that the NST Team decides whether ${nm} becomes something greater.` });
      else if (+c.tier === 3 && (!old || old.tier < 3)) out.push({ t: `${nm} at tier 3 needs the chapter's NST Rep to sign off.` });
      if (old && +c.tier - old.tier > 1) out.push({ t: `${nm} jumps from tier ${old.tier} to ${c.tier}. Lesser Evils grow one step per season at most.` });
      const home = c.kind === "lesser" ? LESSER[c.group]?.home : null;
      if (home && home !== c.region) out.push({ t: `${LESSER[c.group].name} belongs to ${R[home].name}. Talk to ${R[home].name}'s NST Rep before using them.` });
      if (c.kind === "other" && !String(c.name || "").trim()) out.push({ t: "Give this threat a name so players and other chapters can tell it apart." });
    }
    if (c.type === "mark" && !c.remove) {
      if (!String(c.label || "").trim()) out.push({ t: "Give the pinpoint a name, so players can tell what it marks." });
      if (!c.site && c.x == null && !findMark(running, c.mid)) out.push({ t: "This pinpoint has no spot yet. Press Place on the map, or pick a site, or it shows as region-wide." });
    }
    running = applyEvent(running, { changes: [c] });
  }
  const evilsAtT2 = new Set(); dr.changes.forEach(c => { const rid = c.region || c.to; const t = running[rid]?.p[c.evil]; if (t === 2 && c.evil) evilsAtT2.add(c.evil); });
  if (evilsAtT2.size > 1) out.push({ t: "More than one External Evil at pocket-problem level in one event. The guidebook allows one per event so players can tell them apart." });
  if (!isNST() && dr.chapter !== "national" && !myChapters().includes(dr.chapter)) out.push({ hard: true, nst: true, t: "You can only record events for your own chapter." });
  if (!isNST() && dr.chapter === "national") out.push({ hard: true, nst: true, t: "National events are recorded by the NST Team. Pick your chapter." });
  return out;
}
const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(sel ?? "") === String(v) ? "selected" : ""}>${esc(l)}</option>`;

function tierOptions(sel, min = 0, max = 5) { return TIERS.filter(t => t.n >= min && t.n <= max).map(t => opt(t.n, `${t.n} · ${t.name}`, +sel)).join(""); }

}

    if (label) labels[key] = label; else delete labels[key];
    const msg = t.id === "turn-open" ? `Year ${allTurnKeys().length + 1} has begun` : "Year renamed";
    await saveSetting("turns", { open: key, labels }, msg); return;
  }
  if (t.id === "d-new") { S.draft = newDraft(); S.idx = EV.length - 1; refreshAll(false); return; }
  if (t.id === "d-cancel") { S.draft = null; refreshAll(false); return; }
  if (t.id === "d-save") { await saveDraft(); return; }
  if (d.addc) { const dr = ensureDraft(); dr.changes.push(freshChange(d.addc)); claimChapter(dr, S.selected); refreshAll(false); return; }
  if (d.delc !== undefined) { S.draft.changes.splice(+d.delc, 1); refreshAll(false); return; }
  if (d.edit) { const ev = S.events.find(x => x.id === d.edit); if (ev) { S.draft = clean({ id: ev.id, title: ev.title || "", when: ev.when || "", chapter: ev.chapter || "national", visibility: ev.visibility || "story", summary: ev.summary || "", changes: ev.changes || [], turn: turnKey(ev) }); S.tab = "log"; refreshAll(false); } return; }
  if (d.del) { S.confirmDel = d.del; renderLog(); return; }
  if (d.delno) { S.confirmDel = null; renderLog(); return; }
  if (d.delok) { S.confirmDel = null; try { await Store.deleteEvent(d.delok); toast("Event deleted"); } catch (x) { toast("Couldn't delete: " + (x?.message || "")); } return; }
  if (d.up) { await swapOrder(+d.up, +d.up - 1); return; }
  if (d.down) { await swapOrder(+d.down, +d.down + 1); return; }
  if (t.id === "clear-ex") { for (const ev of S.events.filter(x => x.example)) { try { await Store.deleteEvent(ev.id); } catch (x) {} } toast("Example events removed"); return; }
  if (t.id === "seed-open") { try { await Store.saveEvent({ ...OPENING, example: false }); toast("Opening positions saved"); } catch (x) { toast("Couldn't save"); } return; }
  if (t.id === "lay-toggle") { S.layoutMode = !S.layoutMode; renderMap({ fresh: false }); renderSide(); return; }
  if (t.id === "lay-reset") { S.positions = {}; renderMap({ fresh: false }); try { await Store.savePositions({}); toast("Positions reset"); } catch (x) {} return; }
  if (t.id === "exp") { exportJSON(); return; }
});
async function doSignIn() {
  const code = $("code-in")?.value.trim(); if (!code) return;
  try { await Store.signIn(code); $("pop").hidden = true; afterAuth(true); toast(`Signed in as ${Store.me.name || "a rep"}`); }
  catch (x) { toast(x?.message || "That code wasn't recognised"); }
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "code-in") { doSignIn(); return; }
  if (e.key === "Escape") {
    if (!$("pop").hidden) { $("pop").hidden = true; return; }
    if (S.placing) { S.placing = null; renderRegionView({ fresh: false }); return; }
    if ($("mapwrap").classList.contains("fs") && !document.fullscreenElement) { setFS(false); return; }
    if (RV.id) { closeRegion(); return; }
  }
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowRight") { stop(); stepTurn(1); }
  if (e.key === "ArrowLeft") { stop(); stepTurn(-1); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "scrub") { stop(); if (TURNS[+t.value]) goTo(TURNS[+t.value].last, false); return; }
  if (!S.draft) return;
  if (t.id === "d-title") { S.draft.title = t.value; const b = $("d-save"); if (b) b.disabled = !t.value.trim() || (!isNST() && draftWarnings(S.draft).some(w => w.nst)); return; }
  if (t.id === "d-when") { S.draft.when = t.value; return; }
  if (t.id === "d-sum") { S.draft.summary = t.value; return; }
  if (t.dataset.ci !== undefined && t.tagName === "INPUT" && t.type !== "checkbox") { S.draft.changes[+t.dataset.ci][t.dataset.f] = t.value; return; }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if ((t.id && t.id.startsWith("ly-")) || t.id === "rv-names") { try { const o = {}; document.querySelectorAll(".layers input, #rv-names").forEach(i => o[i.id] = i.checked); localStorage.setItem("alwm.layers", JSON.stringify(o)); } catch (x) {} renderMap({ fresh: false }); return; }
  if (t.id === "st-sel") { setStatus(t.value); return; }
  if (t.id === "log-filter") { S.logFilter = t.value; renderSide(); return; }
  if (!S.draft) return;
  if (t.id === "d-ch") { S.draft.chapter = t.value; refreshAll(false); return; }
  if (t.id === "d-vis") { S.draft.visibility = t.value; return; }
  if (t.id === "d-turn") { S.draft.turn = +t.value; renderSide(); return; }
  if (t.dataset.ci !== undefined) {
    const i = +t.dataset.ci, c = S.draft.changes[i], f = t.dataset.f;
    if (f === "type") S.draft.changes[i] = freshChange(t.value, c.region || c.to);
    else if (f === "keep" || f === "remove" || f === "all") c[f] = t.checked;
    else if (f === "tier") c.tier = +t.value;
    else if (f === "region") { c.region = t.value; c.site = ""; if (c.type === "mark") { c.x = null; c.y = null; } }
    else if (f === "site" && c.type === "mark") { if (t.value !== "__xy") Object.assign(c, { site: t.value, x: null, y: null, wide: !t.value }); }
    else if (f === "mid") {
      if (t.value === "__new") Object.assign(c, { mid: newMid(), label: "", remove: false });
      else { const st = draftBaseState(), rid = findMark(st, t.value), old = st[rid].marks[t.value]; Object.assign(c, { mid: t.value, icon: old.icon, label: old.label, region: rid, site: old.site || "", x: old.x, y: old.y, note: old.note || "" }); }
    }
    else if (f === "from") { c.from = t.value; c.fromSite = ""; }
    else if (f === "to") { c.to = t.value; c.toSite = ""; }
    else if (f === "kind") { c.kind = t.value; c.group = t.value === "lesser" ? (Object.keys(LESSER).find(k => LESSER[k].home === c.region) || "forsworn") : "bandits"; if (c.kind === "lesser" && c.tier > 3 && !isNST()) c.tier = 3; }
    else if (f === "tid") {
      if (t.value === "__new") Object.assign(c, { tid: newTid(), name: "", remove: false });
      else { const st = draftBaseState(), rid = findThreat(st, t.value), old = st[rid].threats[t.value]; Object.assign(c, { tid: t.value, kind: old.kind, group: old.group, name: old.name, tier: old.tier, region: rid, site: old.site || "", note: old.note || "" }); }
    }
    else c[f] = t.value;
    refreshAll(false);
  }
});
$("tl-first").onclick = () => { stop(); goTo(0, false); };
$("tl-prev").onclick = () => { stop(); stepTurn(-1); };
$("tl-next").onclick = () => { stop(); stepTurn(1); };
$("tl-play").onclick = () => { S.playing ? stop() : play(); };
let playTimer = null;
function play() {
  if (TURNS.length < 2) return;
  if (S.draft && S.draft.changes.length) { toast("Finish or discard the draft to play the story"); return; }
  S.draft = null;
  S.playing = true; if (S.idx >= EV.length - 1) goTo(0, false); else renderChrome();
  const tick = () => { if (!S.playing) return; if (S.idx >= EV.length - 1) { stop(); return; } stepTurn(1); playTimer = setTimeout(tick, 2600); };
  playTimer = setTimeout(tick, 900);
}
function stop() { S.playing = false; clearTimeout(playTimer); $("tl-play").textContent = "▶"; $("tl-play").setAttribute("aria-label", "Play the story"); }

async function exportJSON() {
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), events: S.usingFallback ? [OPENING] : S.events, sites: Object.values(S.sites), notes: S.notes, positions: S.positions, settings: S.settings, dispatches: S.dispatches, calendar: S.calendar, requests: S.requests }, null, 2);
  if (S.downloads) { try { await S.downloads.save({ filename: "abandoned-lands-story.json", data }); return; } catch (e) { if (e?.code === "declined") return; } }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = "abandoned-lands-story.json"; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { try { await navigator.clipboard.writeText(data); toast("Story copied to the clipboard as JSON"); } catch (x) { toast("Export isn't available in this view"); } }
}

function refreshAll(fresh) {
  rebuild();
  if (S.jumpToId) { const i = EV.findIndex(e => e.id === S.jumpToId); if (i >= 0) S.idx = TURNS[turnIndexOf(i)].last; S.jumpToId = null; }
  renderMap({ fresh: !!fresh }); renderChrome();
}
function setSettings(o) {
  S.settings = { notice: o.notice || { text: NOTICE_TEXT, done: [] }, regions: o.regions || {}, danger: o.danger || {}, calendar: o.calendar || {}, turns: o.turns || {} };
  applyRegionInfo();
}
function applyData(d, first) {
  const atEnd = S.idx >= EV.length - 1;
  if (d.events) S.events = d.events.map(e => ({ ...e, changes: typeof e.changes === "string" ? JSON.parse(e.changes || "[]") : (e.changes || []) }));
  if (d.sites) S.sites = Array.isArray(d.sites) ? Object.fromEntries(d.sites.map(s => [s.id, s])) : d.sites;
  if (d.notes) S.notes = d.notes;
  if (d.positions) S.positions = d.positions;
  if (d.settings) setSettings(d.settings);
  applyLists(d);
  S.loaded = true;
  S.usingFallback = S.events.length === 0;
  if (first || atEnd) S.idx = 9999;
  refreshAll(!!first);
}

/* ---------- Storage: Google Sheet, or this browser ---------- */
function startSheets() {
  Store.mode = "sheets";
  let code = ""; try { code = localStorage.getItem("alwm.code") || ""; } catch (e) {}
  let first = true;
  const load = async () => {
    const u = new URL(CONFIG.apiUrl); u.searchParams.set("action", "load"); if (code) u.searchParams.set("code", code);
    const r = await fetch(u.toString(), { cache: "no-store" }); const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (j.badCode && code) { code = ""; try { localStorage.removeItem("alwm.code"); } catch (e) {} toast("Your rep code is no longer valid. Sign in again."); }
    const before = Store.me.role;
    Store.me = j.me || { role: "viewer", name: "", chapters: [] };
    applyData(j, first); first = false;
    if (before !== Store.me.role) afterAuth(false);
  };
  const post = async (action, payload) => {
    const r = await fetch(CONFIG.apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, code, ...payload }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "The story sheet refused that change");
    await load(); return j;
  };
  Store.signIn = async c => { const prev = code; code = c; try { await load(); } catch (e) { code = prev; throw e; } if (Store.me.role === "viewer") { code = prev; throw new Error("That rep code wasn't recognised"); } try { localStorage.setItem("alwm.code", code); } catch (e) {} };
  Store.signOut = async () => { code = ""; try { localStorage.removeItem("alwm.code"); } catch (e) {} await load(); };
  Store.saveEvent = async ev => (await post("saveEvent", { event: ev })).id;
  Store.deleteEvent = id => post("deleteEvent", { id });
  Store.reorder = orders => post("reorder", { orders });
  Store.saveSite = site => post("saveSite", { site });
  Store.deleteSite = id => post("deleteSite", { id });
  Store.saveNote = (region, note) => post("saveNote", { region, note });
  Store.savePositions = positions => post("savePositions", { positions });
  Store.saveSetting = (key, value) => post("saveSetting", { key, value });
  Store.act = (action, payload) => post(action, payload);
  load().catch(e => { S.loaded = true; toast("Couldn't reach the story sheet: " + e.message); refreshAll(false); });
  setInterval(() => { if (!document.hidden && !S.draft && !S.placing && !S.dispForm && !S.calForm && !S.reqForm && !rdrag && !drag) load().catch(() => {}); }, Math.max(15, CONFIG.pollSeconds) * 1000);
}
function startLocal() {
  Store.mode = "local";
  const KEY = "alwm.local";
  const fresh = () => ({ events: [{ ...OPENING, example: false }], sites: [], notes: {}, positions: {}, dispatches: [], calendar: [], requests: [] });
  let data = null; try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!data) data = fresh();
  let demo = false; try { demo = localStorage.getItem("alwm.demo") === "1"; } catch (e) {}
  const setMe = () => { Store.me = demo ? { role: "lead", name: "Demo editor", chapters: [] } : { role: "viewer", name: "", chapters: [] }; };
  setMe();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} applyData(clean(data)); };
  Store.signIn = async on => { demo = !!on; try { localStorage.setItem("alwm.demo", demo ? "1" : "0"); } catch (e) {} setMe(); };
  Store.signOut = async () => Store.signIn(false);
  Store.reset = () => { data = fresh(); save(); };
  Store.saveEvent = async ev => { const ex = ev.id && data.events.find(e => e.id === ev.id); if (ex) Object.assign(ex, ev); else { ev = { ...ev, id: ev.id || "ev" + Date.now().toString(36) }; data.events.push(ev); } save(); return ev.id; };
  Store.deleteEvent = async id => { data.events = data.events.filter(e => e.id !== id); save(); };
  Store.reorder = async list => { list.forEach(o => { const e = data.events.find(x => x.id === o.id); if (e) e.order = o.order; }); save(); };
  Store.saveSite = async s => { data.sites = data.sites.filter(x => x.id !== s.id).concat([s]); save(); };
  Store.deleteSite = async id => { data.sites = data.sites.filter(x => x.id !== id); save(); };
  Store.saveNote = async (region, n) => { data.notes[region] = n; save(); };
  Store.savePositions = async p => { data.positions = p; save(); };
  Store.saveSetting = async (key, value) => { (data.settings ||= {})[key] = value; save(); };
  Store.act = async (a, p) => { const r = reduceAct(data, Store.me, a, p), list = (data[r.coll] ||= []).filter(x => x.id !== r.id); if (r.doc) list.push(r.doc); data[r.coll] = list; save(); return { id: r.id }; };
  applyData(clean(data), true);
}

/* ---------- Boot ---------- */
if (EMBED) document.body.classList.add("embed");
buildMapSkeleton(); renderLegend();
S.idx = 9999;
if (["dispatches", "calendar", "overview", "log"].includes(PARAMS.get("tab"))) S.tab = PARAMS.get("tab");
refreshAll(true);
$("layers").open = false;
(async () => {
  if (CONFIG.apiUrl) startSheets(); else startLocal();
  afterAuth(false);
  const rg = PARAMS.get("region");
  if (rg && R[rg]) openRegion(rg, false);
})();
})();
</script>
